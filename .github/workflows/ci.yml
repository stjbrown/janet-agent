name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build, typecheck, and test
        run: pnpm verify

      - name: Package and clean-install smoke
        run: |
          JANET_VERSION="$(node -p 'require("./package.json").version')"
          npm pack --silent --pack-destination "$RUNNER_TEMP"
          tarball="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'janet-agent-*.tgz' -print -quit)"
          test -n "$tarball"

          tar tzf "$tarball" | grep -q 'package/dist/main.js'
          for skill in kb kb-init kb-ingest kb-document kb-query kb-lint kb-visualize; do
            tar tzf "$tarball" | grep -q "package/skills/$skill/SKILL.md"
          done
          tar tzf "$tarball" | grep -q 'package/skills/kb-lint/scripts/conformance.mjs'
          tar tzf "$tarball" | grep -q 'package/LICENSE'
          tar tzf "$tarball" | grep -q 'package/NOTICE'

          node -e '
            const fs = require("node:fs");
            const p = require("./package.json");
            if (p.name !== "janet-agent") process.exit(1);
            if (JSON.stringify(p.bin) !== JSON.stringify({ janet: "dist/main.js" })) process.exit(1);
            if (JSON.stringify(p.os) !== JSON.stringify(["darwin"])) process.exit(1);
            const skillsVersion = p.devDependencies["@stjbrown/agent-knowledge-skills"];
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(skillsVersion)) process.exit(1);
            const kbSkill = fs.readFileSync("skills/kb/SKILL.md", "utf8");
            if (!kbSkill.includes(`\nversion: ${skillsVersion}\n`)) process.exit(1);
          '

          mkdir -p "$RUNNER_TEMP/janet-package-smoke"
          npm install --prefix "$RUNNER_TEMP/janet-package-smoke" "$tarball"
          "$RUNNER_TEMP/janet-package-smoke/node_modules/.bin/janet" --help >/dev/null
          test "$("$RUNNER_TEMP/janet-package-smoke/node_modules/.bin/janet" --version)" = "$JANET_VERSION"

          mkdir -p "$RUNNER_TEMP/janet-project/knowledge"
          printf '# Knowledge\n' > "$RUNNER_TEMP/janet-project/knowledge/index.md"
          "$RUNNER_TEMP/janet-package-smoke/node_modules/.bin/janet" \
            -C "$RUNNER_TEMP/janet-project" lint >/dev/null
